name: DroidTerminal CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Verify DroidTerminal
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v4

      - name: Install NDK and CMake
        run: |
          sdkmanager --install "ndk;29.0.14206865" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0"

      - name: Run Native C++ Tests
        run: |
          g++ -std=c++17 -Wall -Wextra \
              -I app/src/main/cpp/include \
              app/src/main/cpp/pty/process_manager.cpp \
              app/src/main/cpp/pty/io_loop.cpp \
              app/src/main/cpp/pty/terminal_resize.cpp \
              tests/native/test_pty_engine.cpp \
              -o test_pty_engine -lutil -lpthread
          ./test_pty_engine

      - name: Run Python VT Parser Test Suite
        run: |
          python3 tests/native/test_parser.py

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew || true

      - name: Build Debug & Release APKs
        run: |
          ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DroidTerminal-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DroidTerminal-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7
